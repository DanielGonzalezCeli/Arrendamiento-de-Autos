name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autos_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d autos_db"
          --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autos_db
      CORS_ORIGINS: http://localhost:5173
      USER_JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # URL base fija para los enlaces HATEOAS (igual que en producción)
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migration:run
      - run: npm run seed
      - run: npm test -- --reporters=default --reporters=github-actions

  gateway:
    name: API Gateway (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ms-identidad:
    name: ms-identidad (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-identidad
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autos_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d autos_db"
          --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autos_db
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ms-identidad/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:prepare
      - run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # La web entra por el API Gateway (puerto 3000) y este reenvía a ms-reservas (3001) o a ms-identidad (3002),
  # igual que en producción: el registro y el login van a ms-identidad, que emite el token que valida ms-reservas.
  e2e:
    name: E2E (Playwright, flujo de compra vía gateway)
    needs: [backend, gateway, ms-identidad, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autos_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d autos_db"
          --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autos_db
      CORS_ORIGINS: http://localhost:5173
      USER_JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      PUBLIC_BASE_URL: http://localhost:3000
      VITE_API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ms-reservas (migraciones, seed y arranque en el 3001)
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm run migration:run
          npm run seed
          PORT=3001 TRUST_PROXY_HOPS=1 IDENTITY_URL=http://localhost:3002 nohup node dist/main > ../api.log 2>&1 &
      - name: ms-identidad (migraciones, usuarios de demo y arranque en el 3002)
        working-directory: ms-identidad
        run: |
          npm ci
          npm run build
          npm run db:prepare
          PORT=3002 TRUST_PROXY_HOPS=1 MS_RESERVAS_URL=http://localhost:3001 nohup node dist/main.js > ../identidad.log 2>&1 &
      - name: API Gateway (puerto 3000 → ms-reservas / ms-identidad)
        working-directory: gateway
        run: |
          npm ci
          npm run build
          PORT=3000 MS_RESERVAS_URL=http://localhost:3001 MS_IDENTIDAD_URL=http://localhost:3002 nohup node dist/main > ../gateway.log 2>&1 &
      - name: Frontend (build y servidor de previsualización)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../web.log 2>&1 &
      - name: Esperar a que todos respondan
        run: npx --yes wait-on@8 -t 60000 http://localhost:3001/health http://localhost:3002/health http://localhost:3000/gateway/health http://localhost:5173
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs si falla
        if: failure()
        run: tail -n 50 api.log identidad.log gateway.log web.log

  # Despliegue a Azure App Service (Linux, Node 22), solo si todo lo anterior pasó en main. Tres Web Apps en el
  # mismo plan B1: ms-identidad, ms-reservas y el API Gateway, que conserva la URL pública rutalibre-autos-api
  # (la que tiene registrada Booking). Orden: ms-identidad primero (es dueño de la tabla de usuarios y la migra),
  # luego ms-reservas y al final el gateway, que ya puede enrutar a ambos. Los paquetes van ya compilados
  # (dist + dependencias de producción); el comando de inicio de cada app está en Azure, y los secretos en su configuración.
  deploy-ms-identidad:
    name: Deploy ms-identidad (Azure App Service)
    needs: [backend, gateway, ms-identidad, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-ms-identidad
    environment:
      name: azure-ms-identidad
      url: https://rutalibre-ms-identidad.azurewebsites.net/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ms-identidad/package-lock.json
      - name: Build y dependencias de producción
        working-directory: ms-identidad
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
      - name: Armar el paquete
        run: |
          mkdir -p pkg/ms-identidad
          cp -r ms-identidad/dist ms-identidad/node_modules ms-identidad/package.json pkg/ms-identidad/
          (cd pkg && zip -qr ../ms-identidad.zip .)
      - uses: azure/webapps-deploy@v3
        with:
          app-name: rutalibre-ms-identidad
          publish-profile: ${{ secrets.AZURE_MSIDENTIDAD_PUBLISH_PROFILE }}
          package: ms-identidad.zip
      - name: Verificar /health y el JWKS
        run: npx --yes wait-on@8 -t 600000 https://rutalibre-ms-identidad.azurewebsites.net/health https://rutalibre-ms-identidad.azurewebsites.net/.well-known/jwks.json

  deploy-ms-reservas:
    name: Deploy ms-reservas (Azure App Service)
    needs: [deploy-ms-identidad]
    runs-on: ubuntu-latest
    concurrency: deploy-ms-reservas
    environment:
      name: azure-ms-reservas
      url: https://rutalibre-ms-reservas.azurewebsites.net/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build y dependencias de producción
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
      - name: Armar el paquete
        run: |
          mkdir -p pkg/backend
          cp -r backend/dist backend/node_modules backend/package.json pkg/backend/
          cp -r contracts pkg/
          (cd pkg && zip -qr ../ms-reservas.zip .)
      - uses: azure/webapps-deploy@v3
        with:
          app-name: rutalibre-ms-reservas
          publish-profile: ${{ secrets.AZURE_MSRESERVAS_PUBLISH_PROFILE }}
          package: ms-reservas.zip
      - name: Verificar /health
        run: npx --yes wait-on@8 -t 600000 https://rutalibre-ms-reservas.azurewebsites.net/health

  deploy-gateway:
    name: Deploy API Gateway (Azure App Service)
    needs: [deploy-ms-reservas]
    runs-on: ubuntu-latest
    concurrency: deploy-gateway
    environment:
      name: azure
      url: https://rutalibre-autos-api.azurewebsites.net/gateway/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Build y dependencias de producción
        working-directory: gateway
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
      - name: Armar el paquete
        run: |
          mkdir -p pkg/gateway
          cp -r gateway/dist gateway/node_modules gateway/package.json pkg/gateway/
          (cd pkg && zip -qr ../gateway.zip .)
      - uses: azure/webapps-deploy@v3
        with:
          app-name: rutalibre-autos-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: gateway.zip
      - name: Verificar la salud agregada, el contrato v3 y el login a través del gateway
        run: |
          npx --yes wait-on@8 -t 300000 https://rutalibre-autos-api.azurewebsites.net/gateway/health https://rutalibre-autos-api.azurewebsites.net/api/v3/health
          # Credenciales inválidas a propósito: 401 de ms-identidad (y no 404) prueba que /api/auth ya llega al servicio nuevo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://rutalibre-autos-api.azurewebsites.net/api/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"verificacion-ci@rutalibre.test","password":"no-es-la-clave"}')
          echo "POST /api/auth/login → $code"
          test "$code" = "401"
