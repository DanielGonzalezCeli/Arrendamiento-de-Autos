name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autos_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d autos_db"
          --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autos_db
      CORS_ORIGINS: http://localhost:5173
      USER_JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # URL base fija para los enlaces HATEOAS (igual que en producción)
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migration:run
      - run: npm run seed
      - run: npm test -- --reporters=default --reporters=github-actions

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, flujo de compra)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autos_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d autos_db"
          --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autos_db
      CORS_ORIGINS: http://localhost:5173
      USER_JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      PUBLIC_BASE_URL: http://localhost:3000
      VITE_API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend (migraciones, seed y arranque)
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm run migration:run
          npm run seed
          nohup node dist/main > ../api.log 2>&1 &
      - name: Frontend (build y servidor de previsualización)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../web.log 2>&1 &
      - name: Esperar a que ambos respondan
        run: npx --yes wait-on@8 -t 60000 http://localhost:3000/health http://localhost:5173
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs si falla
        if: failure()
        run: tail -n 50 api.log web.log
