# Blueprint de Render: API (Docker) + frontend (sitio estático). La BD vive en Supabase.
# Las variables marcadas con sync:false se cargan a mano en el dashboard (secretos o URLs).
services:
  - type: web
    name: arrendamiento-autos-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Secreto de los JWT de usuarios web: Render lo genera aleatoriamente.
      - key: USER_JWT_SECRET
        generateValue: true
      # Contraseñas de los usuarios de demo que crea el seed en una BD vacía.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false
      # Secreto del cliente OAuth2 de demo (booking-hub-demo) del emisor local RDA1.
      - key: SEED_HUB_CLIENT_SECRET
        sync: false
      # Clave RSA del emisor local; sin ella se genera una efímera en cada arranque.
      - key: LOCAL_OAUTH_PRIVATE_KEY
        sync: false

  - type: web
    name: arrendamiento-autos-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # SPA: cualquier ruta del navegador la resuelve React Router.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_BASE_URL
        sync: false
